<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2App Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Web2App Generator</h1>
        <p>将任意网站一键生成为 Android APP</p>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="输入网站链接 (例如: https://example.com/)" required>
        </div>

        <div class="input-group" id="appNameGroup" style="display: none; animation: fadeIn 0.5s;">
            <label for="appNameInput"
                style="display: block; text-align: left; margin-bottom: 8px; color: #666; font-size: 14px; width: 80%; margin-left: auto; margin-right: auto;">App
                名称</label>
            <div class="input-wrapper">
                <img id="appIconPreview" src="" alt="App Icon" title="点击更换图标">
                <div id="iconUploadTip" style="display:none; font-size: 10px; color: #888; margin-top: 4px;">点击更换</div>
                <input type="file" id="iconUploadInput" accept="image/*" style="display: none;">
                <input type="text" id="appNameInput" placeholder="正在获取推荐标题..." required>
            </div>
        </div>

        <button id="generateBtn" class="generate-btn">生成 App</button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在生成中...</p>
        </div>

        <div id="status"></div>
        <div id="result"></div>

        <div class="footer">
            <a href="https://github.com/seavers/web2app" target="_blank" class="github-link">
                <svg height="24" width="24" viewBox="0 0 16 16" version="1.1" class="github-icon" aria-hidden="true">
                    <path fill-rule="evenodd"
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                </svg>
                <span>GitHub</span>
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
