<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2App Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Web2App Generator</h1>
        <p>将任意网站一键生成为 Android APP</p>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="输入网站链接 (例如: https://example.com/)" required>
        </div>

        <button id="generateBtn" class="generate-btn">生成 App</button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在生成中...</p>
        </div>

        <div id="status"></div>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
